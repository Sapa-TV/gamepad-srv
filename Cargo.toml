[package]
name = "gamepad_srv"
version = "0.4.1"
edition = "2024"
metadata = { embedded-dependencies = true }

[dependencies]
anyhow = "1"
axum = { version = "0.8.6", features = ["macros", "ws"] }
futures = "0.3.31"
gilrs = "0.8"
local-ip-address = "0.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.8"
tokio = { version = "1.48.0", features = ["full", "signal", "tokio-macros"] }
tower-http = { version = "0.6.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
enable-ansi-support = "0.3"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
tokio-util = { version = "0.7.18", features = ["rt"] }
better_tokio_select = "0.2.0"
atomic_enum = "0.3.0"
arrayvec = "0.7.6"

[profile.release]
opt-level = "z"
lto = true
debug = 0
strip = true
panic = "abort"
codegen-units = 1
