<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Gamepad</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
  </head>
  <body>
    <div class="error hidden">Ошибка загрузки скина</div>

    <div class="gamepad hidden">
      <img class="bg" data-name="body" alt="body" />

      <img class="indicator" data-name="indicator" />

      <img class="btn" data-name="DPadUp" />
      <img class="btn" data-name="DPadDown" />
      <img class="btn" data-name="DPadLeft" />
      <img class="btn" data-name="DPadRight" />

      <img class="btn" data-name="South" />
      <img class="btn" data-name="East" />
      <img class="btn" data-name="West" />
      <img class="btn" data-name="North" />

      <img class="btn" data-name="LeftShoulder" />
      <img class="btn" data-name="RightShoulder" />
      <img class="btn" data-name="LeftTrigger" />
      <img class="btn" data-name="RightTrigger" />

      <img class="stick" data-name="LeftStick" />
      <img class="stick-active" data-name="LeftStickPressed" />

      <img class="stick" data-name="RightStick" />
      <img class="stick-active" data-name="RightStickPressed" />

      <img class="btn" data-name="Select" />
      <img class="btn" data-name="Start" />
    </div>
    <script src="script.js"></script>
  </body>
</html>
